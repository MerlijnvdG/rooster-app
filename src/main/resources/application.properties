spring.application.name=rooster
spring.profiles.active=dev

# h2 in memory
spring.datasource.url=jdbc:h2:mem:roosterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# alleen voor lokaal
jwt.secret=RoosterSecretKeyForJwtSigning2024MustBe256BitsLong!!
jwt.expiration-ms=86400000

# zodat je telefoon op hetzelfde wifi erbij kan
server.address=0.0.0.0

# CORS - kept for config wiring; actual CORS uses allowedOriginPatterns(*) in SecurityConfig
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
