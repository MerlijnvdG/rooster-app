# postgres, zet SPRING_DATASOURCE_URL, _USERNAME en _PASSWORD als env vars
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# JWT_SECRET zetten, minstens 32 tekens
jwt.secret=${JWT_SECRET:7Kx9mQpL3nRvWjY2sHdF8bTcAeNuZo4gXiP6wMlVqE5rCk1yOsBtJhGfDaIu0}
jwt.expiration-ms=86400000

server.port=${PORT:8080}
server.address=0.0.0.0

# extra cors origins, komma gescheiden
# bv. app.cors.extra-origins=https://mijn-nieuwe-backend.fly.dev
app.cors.extra-origins=${CORS_EXTRA_ORIGINS:}
