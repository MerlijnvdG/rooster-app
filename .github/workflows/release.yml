name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE_URL: https://rooster-app.up.railway.app
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'Rooster ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Upload updater artifacts and latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $nsisDir = "frontend\src-tauri\target\release\bundle\nsis"
          $nsisZip = (Get-ChildItem -Path $nsisDir -Filter "*.nsis.zip" | Select-Object -First 1).FullName
          if (-not $nsisZip) { Write-Error "NSIS zip not found in $nsisDir"; exit 1 }
          $nsisSig = $nsisZip + ".sig"
          Write-Host "NSIS ZIP: $nsisZip"
          Write-Host "NSIS SIG: $nsisSig"
          gh release upload $tag "$nsisZip" "$nsisSig" --clobber
          $sigContent = Get-Content -Path $nsisSig -Raw
          $filename = [System.IO.Path]::GetFileName($nsisZip)
          $urlFilename = $filename.Replace(' ', '.')
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $url = "https://github.com/MerlijnvdG/rooster-app/releases/download/$tag/$urlFilename"
          $json = @{
            version = $version
            notes = ""
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent.Trim()
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 5
          $json | Out-File -FilePath latest.json -Encoding utf8
          gh release upload $tag latest.json --clobber

      - name: Deploy to Railway
        run: |
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"f9d55309-3e5f-48d4-9870-1d9f7c937e2e\", environmentId: \"ccc8baa3-60f9-48f6-b852-c4135cea953a\") }"}'
        shell: bash
